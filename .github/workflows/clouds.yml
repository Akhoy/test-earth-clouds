name: Build and publish cloud mask (every 3 hours)

on:
  schedule:
    # Hourly attempts: GitHub's scheduler is best-effort and fired only 4 of the first ~16 three-hourly triggers
    # (2026-11-15/16).  Each run builds the latest complete 3-hour slot (~1.5 h after the scan) and exits early when
    # the published root.json already points at it, so the extra attempts cost ~30 s each.
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "YYYYmmddTHH (optional; default = latest complete slot)"
        required: false

permissions:
  contents: write

concurrency:
  group: clouds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fixed inputs reused across runs: Himawari's lat/lon grid (first run downloads one full ~350 MB file),
      # the terrain proxy and the monthly snow climatology.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: clouds-cache-${{ github.run_id }}
          restore-keys: clouds-cache-

      - name: Build cloud mask
        run: |
          python clouds/run.py --out site \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --skip-if-current "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/root.json" \
            ${{ github.event.inputs.slot && format('--slot {0}', github.event.inputs.slot) || '' }}

      - name: Publish to GitHub Pages
        if: hashFiles('site/root.json') != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: false
          force_orphan: true
