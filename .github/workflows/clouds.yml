name: Build and publish cloud mask (every 3 hours, via cron-job.org)

on:
  # (2026-11-28) Started from cron-job.org, not GitHub's own scheduler: POST to this workflow's /dispatches at 02:50,
  # 05:50 ... 23:50 UTC (about 10 min after EUMETSAT publishes each 3-hourly mosaic, ~2 h 42 min after its slot) plus a
  # retry at 00:15, 03:15 ... 21:15 UTC.  A run whose slot is already published exits early (--skip-if-current).
  workflow_dispatch:
    inputs:
      slot:
        description: "YYYYmmddTHH (optional; default = latest complete slot)"
        required: false

permissions:
  contents: write

concurrency:
  group: clouds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Fixed inputs reused across runs: Himawari's lat/lon grid (first run downloads one full ~350 MB file),
      # the terrain proxy and the monthly snow climatology.
      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: cache
          key: clouds-cache-${{ github.run_id }}
          restore-keys: clouds-cache-

      - name: Build cloud mask
        env:                    # (2026-11-28) CAMS haze veil: Copernicus Atmosphere Data Store key (repo secret ADS_KEY)
          CDSAPI_URL: https://ads.atmosphere.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.ADS_KEY }}
        run: |
          python clouds/run.py --out site \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --skip-if-current "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/root.json" \
            ${{ github.event.inputs.slot && format('--slot {0}', github.event.inputs.slot) || '' }}

      - name: Publish to GitHub Pages
        if: hashFiles('site/root.json') != ''
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          keep_files: true      # (2026-11-20, testing) keep earlier versions; only root.json moves
          force_orphan: false
